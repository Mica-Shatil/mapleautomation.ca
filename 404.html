<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Maple Automation</title>
  <meta name="description" content="The requested page could not be found.">
  <meta name="robots" content="noindex,follow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#f4f1ea">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .not-found{display:grid;min-height:100vh;padding:40px 20px;place-items:center;text-align:center}
    .not-found-inner{max-width:760px}
    .not-found h1{margin:12px 0 24px;font-size:clamp(58px,10vw,116px);font-weight:550;letter-spacing:-.065em;line-height:.9}
    .not-found p:not(.eyebrow){max-width:560px;margin:0 auto 34px;color:var(--muted);font-size:18px}
  </style>
</head>
<body>
  <main id="main" class="not-found">
    <div class="not-found-inner">
      <p class="eyebrow">404 · Page not found</p>
      <h1>This workflow<br>led nowhere.</h1>
      <p>The page may have moved, or the address may be incorrect. The useful part is still one click away.</p>
      <a class="button button-primary" href="/">Return home <span aria-hidden="true">→</span></a>
    </div>
  </main>
</body>
</html>
